name: scrape

on:
  workflow_dispatch:
    inputs:
      DEBUG:
        description: 'DEBUG'
        required: false
        default: ''
      sendNewConfigToTg:
        description: 'sendNewConfigToTg'
        required: false
        default: 'false'
  schedule:
    - cron: '0 5,13 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Set container image
        id: set-container-image
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/moneyman:latest" >> $GITHUB_OUTPUT

      - name: Pull container image
        run: docker pull ${{ steps.set-container-image.outputs.image }}

      - name: Run scraper
        env:
          CONFIG_DATA: ${{ secrets.MONEYMAN_CONFIG }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: "Asia/Jerusalem"
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
        run: |
          docker run --rm \
            -e MONEYMAN_CONFIG="$CONFIG_DATA" \
            -e DEBUG \
            -e TZ \
            -e SEND_NEW_CONFIG_TO_TG \
            ${{ steps.set-container-image.outputs.image }}
