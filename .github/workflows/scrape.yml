name: scrape

on:
  workflow_dispatch:
    inputs:
      DEBUG:
        description: 'DEBUG'
        required: false
        default: ''
      sendNewConfigToTg:
        description: 'sendNewConfigToTg'
        required: false
        default: 'false'
  schedule:
    - cron: '0 5,13 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set container image
        id: set-container-image
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/moneyman:latest" >> $GITHUB_OUTPUT

      - name: Pull container image
        run: docker pull ${{ steps.set-container-image.outputs.image }}

      - name: Run scraper
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/moneyman.conf.jsonc:/app/moneyman.json" \
            -e MONEYMAN_CONFIG_PATH=/app/moneyman.json \
            -e DEBUG \
            -e TZ="Asia/Jerusalem" \
            ${{ steps.set-container-image.outputs.image }}
        env:
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
